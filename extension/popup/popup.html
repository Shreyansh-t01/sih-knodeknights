<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GovBridge RPA Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      border: 1.5px dashed #10b981;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .brand span { color: #10b981; }
    .status-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
    }
    .status-idle { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
    .status-recording { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-record {
      background: #0284c7;
      color: #fff;
    }
    .btn-record:hover {
      background: #0369a1;
    }
    .btn-stop {
      background: #10b981;
      color: #06150f;
      font-weight: 700;
    }
    .btn-stop:hover {
      background: #34d399;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">MahaSetu - RPA</div>
    <span id="popup-status" class="status-badge status-idle">IDLE</span>
  </div>

  <div id="idle-controls">
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4;">
      Click below to record user interactions on this tab. Meaningful clicks, inputs, and form events will be captured.
    </p>
    <button id="btn-start-record" class="btn btn-record">
      Start Recording
    </button>
  </div>

  <div id="active-controls" style="display: none;">
    <p style="font-size: 12px; color: #34d399; margin-bottom: 12px;">
      ● Recording in progress! Use the in-page bar or click below to finish.
    </p>
    <button id="btn-stop-record" class="btn btn-stop">
      Stop & Send to MahaSetu
    </button>
  </div>

  <button id="btn-open-portal" class="btn btn-outline" style="margin-top: 6px;">
    Open MahaSetu Portal
  </button>
  <button id="btn-open-demo" class="btn btn-outline">
    Open Demo Login Target
  </button>

  <div class="footer">MahaSetu Automation Engine &bull; Playwright</div>

  <script src="popup.js"></script>
</body>
</html>
